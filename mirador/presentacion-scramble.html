<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Presentación Scramble</title>
<style>
  *{ box-sizing:border-box; }
  body{
    background:#0a0a0a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    font-family:'Geist Mono', ui-monospace, monospace;
    overflow:hidden;
  }

  .slide{
    max-width:80vw;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .slide-logo{
    display:block;
    width: min(560px, 78vw);
    height: auto;
    margin:0 auto 1.5rem;
    display:none;
  }
  .slide-logo.visible{ display:block; animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }

  .slide-logos{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
    gap:2rem 3rem; max-width:80vw; margin-top:2rem;
  }
  .slide-logos:empty{ display:none; }
  .slide-logos img{
    height:clamp(48px, 9vh, 96px); width:auto; max-width:220px; object-fit:contain;
    animation:fadeIn .3s ease;
  }

  .slide-title{
    color:#fff;
    font-size:2.4rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    user-select:none;
    position:relative;
    display:inline-block;
  }

  .slide-row{
    display:flex; align-items:center; justify-content:center;
    gap:4rem; max-width:90vw;
  }
  .slide-row:empty{ display:none; }
  .row-col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:.5rem; }

  .slide-title.big{ font-size:clamp(6rem, 22vw, 14rem); letter-spacing:0; }

  .slide-body{
    color:#aaa;
    font-size:1.1rem;
    margin-top:1.5rem;
    letter-spacing:.02em;
    user-select:none;
    position:relative;
    display:inline-block;
    max-width:60ch;
  }
  .slide-body.align-left{ text-align:left; }

  .slide-body.stacked{
    display:flex;
    flex-direction:column;
    gap:.5rem;
  }
  .slide-body.stacked > div{
    position:relative;
  }

  .sc-real{ color:transparent; }
  .sc-fx{ position:absolute; inset:0; pointer-events:none; }
  .sc-fx > span{ display:inline-block; }

  .hint{
    position:fixed;
    bottom:2rem;
    color:#555;
    font-size:.85rem;
    letter-spacing:.05em;
    user-select:none;
    opacity:1;
    transition:opacity .2s ease;
  }

  .counter{
    position:fixed;
    top:2rem;
    color:#555;
    font-size:.85rem;
    letter-spacing:.05em;
    user-select:none;
    opacity:1;
    transition:opacity .2s ease;
  }

  body.is-fullscreen .hint,
  body.is-fullscreen .counter{
    opacity: 0 !important;
    pointer-events: none !important;
  }

</style>
</head>
<body>

  <div class="counter" id="counter">1 / 1</div>

  <div class="slide">
    <img class="slide-logo" id="logo" src="https://centroeesonoros.org/wp-content/uploads/2026/08/FLAT-Logo-Blanco-Bajada.png" alt="FLAT 2026 — Festival Latinoamericano de Arte y Tecnología">
    <div class="slide-title" id="title"></div>
    <div class="slide-logos" id="logos"></div>
    <div class="slide-row" id="row"></div>
    <div class="slide-body" id="body"></div>
  </div>

  <div class="hint">Enter / → continuar · ← volver · F pantalla completa</div>

<!-- Carga del archivo de configuración externo -->
<script src="secuencia.js"></script>

<script>
// ---------- CONFIG DEL EFECTO SCRAMBLE ----------
  const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789*#&<>/';
  const SCRAMBLE_SWAP_MS = 45;
  const SCRAMBLE_SWAPS   = 6;
  const SCRAMBLE_STAGGER = 6;

  let lineTimers = [];

  // Cancela activamente la animación y desvincula el elemento
  function cancelScramble(element) {
    if (!element) return;
    if (element.__scrambleFrameId) {
      cancelAnimationFrame(element.__scrambleFrameId);
      element.__scrambleFrameId = null;
    }
    element.__scrambleId = null;
    element.style.position = '';
  }

  function animateTextScramble(element, text) {
    // 1. Cancelar cualquier animación en curso en este elemento
    cancelScramble(element);

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      element.textContent = text;
      return;
    }

    // Crear un identificador único para esta instancia
    const animId = Symbol('scramble');
    element.__scrambleId = animId;

    element.style.position = 'relative';
    element.textContent = '';

    const real = document.createElement('span');
    real.className = 'sc-real';
    const charSpans = [];
    for (const ch of text) {
      const s = document.createElement('span');
      s.textContent = ch;
      real.appendChild(s);
      charSpans.push(s);
    }
    element.appendChild(real);

    const fx = document.createElement('span');
    fx.className = 'sc-fx';
    fx.setAttribute('aria-hidden', 'true');
    element.appendChild(fx);

    const base = element.getBoundingClientRect();
    const measured = [];
    charSpans.forEach(s => {
      const tgt = s.textContent;
      if (tgt.trim() === '') return;
      const r = s.getBoundingClientRect();
      measured.push({ target: tgt, left: r.left - base.left, top: r.top - base.top, w: r.width, h: r.height });
    });

    if (measured.length === 0) {
      element.textContent = text;
      element.style.position = '';
      return;
    }

    const cells = measured.map(m => {
      const g = document.createElement('span');
      g.style.cssText =
        'position:absolute;left:' + m.left + 'px;top:' + m.top + 'px;' +
        'width:' + m.w + 'px;height:' + m.h + 'px;line-height:' + m.h + 'px;' +
        'text-align:center;overflow:hidden;';
      fx.appendChild(g);
      return { g, target: m.target, lastStep: -1 };
    });

    const rnd = () => SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
    cells.forEach(c => c.g.textContent = rnd());

    let startTime = null;
    const totalCells = cells.length;

    function step(now) {
      // SI LA ANIMACIÓN FUE CANCELADA O SE CAMBIÓ DE DIAPOSITIVA, ABORTAR INMEDIATAMENTE
      if (element.__scrambleId !== animId) return;

      if (!startTime) startTime = now;
      const elapsed = now - startTime;
      let completedCells = 0;

      cells.forEach((cell, i) => {
        const cellStart = i * SCRAMBLE_STAGGER;
        const cellEnd = cellStart + (SCRAMBLE_SWAPS * SCRAMBLE_SWAP_MS);

        if (elapsed < cellStart) {
          return;
        } else if (elapsed >= cellEnd) {
          cell.g.textContent = cell.target;
          completedCells++;
        } else {
          const currentStep = Math.floor((elapsed - cellStart) / SCRAMBLE_SWAP_MS);
          if (currentStep !== cell.lastStep) {
            cell.g.textContent = rnd();
            cell.lastStep = currentStep;
          }
        }
      });

      if (completedCells === totalCells) {
        element.textContent = text;
        element.style.position = '';
        element.__scrambleFrameId = null;
        element.__scrambleId = null;
      } else {
        element.__scrambleFrameId = requestAnimationFrame(step);
      }
    }

    element.__scrambleFrameId = requestAnimationFrame(step);
  }

  // ---------- SECUENCIA ----------
  const DEFAULT_DWELL = 6000;
  const inFrame = (() => { try { return window.parent && window.parent !== window; } catch(e){ return true; } })();

  const titleEl   = document.getElementById('title');
  const bodyEl    = document.getElementById('body');
  const counterEl = document.getElementById('counter');
  const logoEl    = document.getElementById('logo');
  const logosEl   = document.getElementById('logos');
  const rowEl     = document.getElementById('row');

  let step = 0;          // paso actual dentro de SEQUENCE
  let sub = 0;           // diapositiva actual dentro de un loop
  let phase = 'loop';    // 'loop' | 'info' | 'countdown' | 'performing'
  let seqTimer = null;

  function clearSeqTimer(){ clearTimeout(seqTimer); seqTimer = null; }

  // Dibuja UNA diapositiva (título / cuerpo / logo / logos)
  function renderSlide(slide){
    lineTimers.forEach(t => clearTimeout(t));
    lineTimers = [];
    cancelScramble(titleEl);
    cancelScramble(bodyEl);

    if (slide.logo) {
      logoEl.src = slide.logo;
      logoEl.classList.add('visible');
    } else {
      logoEl.classList.remove('visible');
    }

    logosEl.innerHTML = '';
    if (Array.isArray(slide.logos)) {
      slide.logos.forEach(url => {
        const im = document.createElement('img');
        im.src = url; im.alt = '';
        logosEl.appendChild(im);
      });
    }

    // Fila de dos textos con el mismo estilo que el título: [izquierda, derecha]
    rowEl.querySelectorAll('.slide-title').forEach(cancelScramble);
    rowEl.innerHTML = '';
    if (Array.isArray(slide.row)) {
      slide.row.forEach(item => {
        // cada lado puede ser un texto o un array de textos (uno por línea)
        const col = document.createElement('div');
        col.className = 'row-col';
        rowEl.appendChild(col);
        (Array.isArray(item) ? item : [item]).forEach(text => {
          const cell = document.createElement('div');
          cell.className = 'slide-title';
          col.appendChild(cell);
          animateTextScramble(cell, text);
        });
      });
    }

    titleEl.classList.toggle('big', !!slide.big);
    if (slide.title) {
      animateTextScramble(titleEl, slide.title);
    } else {
      titleEl.textContent = '';
    }

    bodyEl.classList.toggle('align-left', slide.align === 'left');
    if (Array.isArray(slide.lines)) {
      bodyEl.classList.add('stacked');
      bodyEl.innerHTML = '';
      slide.lines.forEach((line, i) => {
        const lineEl = document.createElement('div');
        bodyEl.appendChild(lineEl);
        lineTimers.push(setTimeout(() => animateTextScramble(lineEl, line), i * 80));
      });
    } else if (slide.body) {
      bodyEl.classList.remove('stacked');
      bodyEl.innerHTML = '';
      animateTextScramble(bodyEl, slide.body);
    } else {
      bodyEl.classList.remove('stacked');
      bodyEl.innerHTML = '';
    }
  }

  // ----- Paso tipo LOOP -----
  function showLoopSlide(){
    const group = SEQUENCE[step];
    renderSlide(group.slides[sub]);
    if (group.slides.length > 1) {
      seqTimer = setTimeout(() => {
        sub = (sub + 1) % group.slides.length;
        showLoopSlide();
      }, group.dwell || DEFAULT_DWELL);
    }
  }

  // ----- Paso tipo PERFORMANCE: intro → cuenta regresiva → lanzar -----
  function startPerformanceIntro(p){
    phase = 'info';
    renderSlide({ row: [p.performer, p.work] });   // izquierda: artista · derecha: obra
    seqTimer = setTimeout(() => runCountdown(p, p.countdown || 5), (p.infoSeconds || 5) * 1000);
  }

  function runCountdown(p, n){
    phase = 'countdown';
    if (n <= 0) { launchPerformance(p); return; }
    renderSlide({ title: String(n), big: true });
    seqTimer = setTimeout(() => runCountdown(p, n - 1), 1000);
  }

  function launchPerformance(p){
    phase = 'performing';
    if (inFrame) {
      // El padre (Cuerpo / Señal) oculta este iframe y arranca la performance
      window.parent.postMessage({
        type: 'start-performance',
        slideIndex: step,
        preset: p.preset,
        escena: p.escena,
        audio: p.audio
      }, '*');
    } else if (p.link) {
      // Modo suelto (sin padre): navegar al visual y volver al paso siguiente
      const ownUrl = location.href.split('?')[0].split('#')[0];
      const url = new URL(p.link, location.href);
      if (p.preset) url.searchParams.set('preset', p.preset);
      if (p.escena) url.searchParams.set('escena', p.escena);
      if (p.audio)  url.searchParams.set('audio', p.audio);
      url.searchParams.set('return', ownUrl + '?step=' + (step + 1));
      location.href = url.toString();
    }
  }

  // ----- Ir a un paso -----
  function goStep(i){
    clearSeqTimer();
    if (i >= SEQUENCE.length) i = 0;   // terminada la secuencia, vuelve al primer loop
    if (i < 0) i = 0;
    step = i; sub = 0;
    counterEl.textContent = (step + 1) + ' / ' + SEQUENCE.length;

    const s = SEQUENCE[step];
    if (s.performance) {
      startPerformanceIntro(s.performance);
    } else {
      phase = 'loop';
      showLoopSlide();
    }
  }

  // ---------- PANTALLA COMPLETA VÍA POSTMESSAGE ----------
  function toggleFullscreen() {
    if (inFrame) {
      window.parent.postMessage({ type: 'toggle-fullscreen' }, '*');
    } else if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }

  function setFullscreenState(isFS) {
    document.body.classList.toggle('is-fullscreen', !!isFS);
  }

  document.addEventListener('fullscreenchange', () => {
    setFullscreenState(!!document.fullscreenElement);
  });

  // ---------- MENSAJES DEL PADRE (Cuerpo / Señal) ----------
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'resume-slides') {
      // advance:true = terminó una performance → siguiente paso. Si no, reinicia el paso actual.
      goStep(e.data.advance ? step + 1 : step);
      window.focus();
    } else if (e.data.type === 'fullscreen-changed') {
      setFullscreenState(e.data.isFullscreen);
    }
  });

  // ---------- TECLADO ----------
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;

    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
      e.preventDefault();
      // El trigger solo actúa sobre los loops; la intro y la cuenta regresiva son automáticas
      if (phase === 'loop') goStep(step + 1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      goStep(step - 1);   // también sirve para abortar la intro / cuenta regresiva
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      toggleFullscreen();
    } else if (e.key === 'Backspace') {
      e.preventDefault();
      if (inFrame) window.parent.postMessage({ type: 'close-slides' }, '*');
    }
  });

  // Modo suelto: si volvemos desde el visual (?step=N), arrancamos en ese paso.
  const startAt = parseInt(new URLSearchParams(location.search).get('step'), 10);
  goStep(!isNaN(startAt) ? startAt : 0);
</script>
</body>
</html>
